<div class="start-screen-container">
    <div class="content-box">
        <div class="icon">
            <i class="fa-solid fa-chess"></i>
        </div>

        <p class="subtitle">Jeu Strategique Classique</p>

        <button class="start-btn" (click)="onStart()">
            Commencer
        </button>

        <div class="options">
            <label class="option-label">
                <input type="radio" name="mode" checked> Joueur contre Joueur
            </label>
            <label class="option-label" style="opacity: 0.5; cursor: not-allowed;">
                <input type="radio" name="mode" disabled> Joueur contre Ordinateur (Prochainement)
            </label>
        </div>
    </div>
</div>
